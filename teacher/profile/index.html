<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TrevaForms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../settings/settings.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar" id="top-bar"></header>

            <div class="page-container" style="max-width: 800px;">
                <div style="margin-bottom: 1.5rem;">
                    <h1 style="font-family: var(--serif); font-size: 1.85rem; font-weight: 800;">User Profile</h1>
                    <p style="font-family: var(--merri); font-style: italic; color: var(--brown2); font-size: 0.9rem;">Manage your public account details, avatar, and personal information.</p>
                </div>

                <div class="settings-card-body">
                    <form id="profile-form">
                        <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
                            <img id="profile-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80" alt="User Avatar" style="width: 80px; height: 80px; border-radius: 3px; object-fit: cover; border: 2px solid var(--rule);">
                            <div style="flex: 1;">
                                <label class="form-label">Avatar Image URL</label>
                                <input type="text" id="profile-avatar-url" class="form-control" placeholder="https://...">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="profile-name" class="form-control" placeholder="Meet Shah" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="profile-email" class="form-control" placeholder="meet@trevaforms.app" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Role / Job Title</label>
                            <input type="text" id="profile-role" class="form-control" placeholder="Lead Product Designer">
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;">
                            <span style="font-family: var(--type); font-size: 0.85rem; color: var(--brown2);">Member since January 2026 • Pro Plan</span>
                            <button type="submit" class="btn btn-primary">Save Profile Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="../shared/demo-data.js"></script>
    <script src="../shared/app.js"></script>
    <script src="../settings/settings.js"></script>
</body>
</html>
