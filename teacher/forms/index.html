<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forms - TrevaForms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="forms.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar" id="top-bar"></header>

            <div class="page-container">
                <div class="forms-header-bar">
                    <div>
                        <h1 style="font-family: var(--serif); font-size: 1.85rem; font-weight: 800;">My Forms Ledger</h1>
                        <p style="font-family: var(--merri); font-style: italic; color: var(--brown2); font-size: 0.9rem;">Manage, edit, publish, and track response ledgers for all your forms.</p>
                    </div>

                    <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                        <div class="search-box" style="width: 260px; padding: 6px 12px;">
                            🔍 <input type="text" id="input-forms-search" placeholder="Search form records...">
                        </div>

                        <div style="display: flex; gap: 0.25rem; background: var(--paper); border: 1.5px solid var(--rule); padding: 2px; border-radius: 3px;">
                            <button id="btn-view-grid" class="btn btn-primary btn-sm" title="Grid View">📱 Grid</button>
                            <button id="btn-view-table" class="btn btn-secondary btn-sm" title="Table View">📑 Table</button>
                        </div>

                        <button onclick="openCreateFormModal()" class="create-btn" style="padding: 8px 18px; font-size: 13.5px;">
                            <span>+</span>
                            <span>Create Form</span>
                        </button>
                    </div>
                </div>

                <!-- Tabs Filter Bar -->
                <div class="forms-tabs">
                    <div class="tab-item active" data-tab="all">All Forms</div>
                    <div class="tab-item" data-tab="published">Published</div>
                    <div class="tab-item" data-tab="draft">Drafts</div>
                    <div class="tab-item" data-tab="archived">Archived</div>
                </div>

                <!-- Dynamic Forms Render Target -->
                <div id="forms-container" class="forms-cards-grid">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="../shared/demo-data.js"></script>
    <script src="../shared/app.js"></script>
    <script src="forms.js"></script>
</body>
</html>
