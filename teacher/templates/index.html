<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates - TrevaForms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="templates.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar" id="top-bar"></header>

            <div class="page-container">
                <div class="templates-header-bar">
                    <div>
                        <h1 style="font-family: var(--serif); font-size: 1.85rem; font-weight: 800;">Template Library</h1>
                        <p style="font-family: var(--merri); font-style: italic; color: var(--brown2); font-size: 0.9rem;">Start building instantly with pre-designed parchment form templates.</p>
                    </div>

                    <div class="search-box" style="width: 260px; padding: 6px 12px;">
                        🔍 <input type="text" id="input-templates-search" placeholder="Search templates...">
                    </div>
                </div>

                <!-- Category Pills Bar -->
                <div class="templates-category-filter">
                    <button class="cat-pill active" data-category="All">All Categories</button>
                    <button class="cat-pill" data-category="Education">Education</button>
                    <button class="cat-pill" data-category="Events">Events</button>
                    <button class="cat-pill" data-category="Feedback">Feedback</button>
                    <button class="cat-pill" data-category="Business">Business</button>
                    <button class="cat-pill" data-category="Quiz">Quiz</button>
                    <button class="cat-pill" data-category="Registration">Registration</button>
                </div>

                <!-- Templates Target Grid -->
                <div id="templates-container" class="templates-grid">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="../shared/demo-data.js"></script>
    <script src="../shared/app.js"></script>
    <script src="templates.js"></script>
</body>
</html>
