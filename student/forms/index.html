<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forms — TrevaForms Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/student.css">
    <link rel="stylesheet" href="forms.css">
</head>
<body class="app-shell">
    <aside id="student-sidebar"></aside>

    <div class="main-content">
        <header class="top-header" id="top-header">
            <button class="header-hamburger" id="sidebar-hamburger" aria-label="Menu" onclick="toggleSidebar()">☰</button>
            <span class="header-title" id="header-title">My Assigned Forms</span>
            <div class="header-spacer"></div>
            <div class="header-actions">
                <button class="header-icon-btn" onclick="window.location.href='../notifications/index.html'" title="Notifications">
                    🔔
                    <span class="header-notif-count" id="header-notif-count"></span>
                </button>
                <button class="header-avatar-btn" id="header-avatar" onclick="window.location.href='../profile/index.html'">S</button>
            </div>
        </header>

        <main class="page-content" id="page-content">
            <div class="page-header">
                <h1 class="page-title">Assigned Forms</h1>
                <p class="page-subtitle">Complete forms assigned to your student account by your instructors.</p>
            </div>

            <!-- Controls bar: Tabs on left, Search & Sort on right -->
            <div class="forms-controls-bar">
                <div class="tabs" id="forms-tabs">
                    <button class="tab-btn active" data-tab="all">All (<span id="count-all">0</span>)</button>
                    <button class="tab-btn" data-tab="pending">Pending (<span id="count-pending">0</span>)</button>
                    <button class="tab-btn" data-tab="completed">Completed (<span id="count-completed">0</span>)</button>
                    <button class="tab-btn" data-tab="expired">Expired (<span id="count-expired">0</span>)</button>
                </div>

                <div class="forms-filters">
                    <div class="forms-search-box">
                        <span>🔍</span>
                        <input type="text" id="input-forms-search" placeholder="Search forms by title, instructor...">
                    </div>
                    <select id="select-forms-sort" class="forms-sort-select">
                        <option value="newest">Newest First</option>
                        <option value="deadline">Soonest Deadline</option>
                        <option value="title">Alphabetical (A-Z)</option>
                    </select>
                </div>
            </div>

            <!-- Forms Grid -->
            <div class="forms-grid" id="forms-grid-container">
                <!-- Injected via forms.js -->
                <div class="skeleton-card"><div class="skeleton-line" style="width:60%;"></div><div class="skeleton-line" style="width:40%;"></div><div class="skeleton-line" style="width:90%;"></div></div>
                <div class="skeleton-card"><div class="skeleton-line" style="width:60%;"></div><div class="skeleton-line" style="width:40%;"></div><div class="skeleton-line" style="width:90%;"></div></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../shared/js/supabase-client.js"></script>
    <script src="../shared/app.js"></script>
    <script src="forms.js"></script>
</body>
</html>
