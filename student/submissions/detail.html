<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Details — TrevaForms Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/student.css">
    <link rel="stylesheet" href="submissions.css">
</head>
<body class="app-shell">
    <aside id="student-sidebar"></aside>

    <div class="main-content">
        <header class="top-header" id="top-header">
            <button class="header-hamburger" id="sidebar-hamburger" aria-label="Menu" onclick="toggleSidebar()">☰</button>
            <span class="header-title" id="header-title">Submission Details</span>
            <div class="header-spacer"></div>
            <div class="header-actions">
                <button class="header-icon-btn" onclick="window.location.href='../notifications/index.html'" title="Notifications">
                    🔔
                    <span class="header-notif-count" id="header-notif-count"></span>
                </button>
                <button class="header-avatar-btn" id="header-avatar" onclick="window.location.href='../profile/index.html'">S</button>
            </div>
        </header>

        <main class="page-content" id="page-content">
            <div style="margin-bottom: 20px;">
                <a href="../submissions/index.html" class="btn btn-ghost btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
                    ← Back to all submissions
                </a>
            </div>

            <!-- Detail Mount Container -->
            <div id="submission-detail-mount">
                <div class="skeleton-card" style="padding: 30px;">
                    <div class="skeleton-line" style="width: 50%; height: 24px; margin-bottom: 12px;"></div>
                    <div class="skeleton-line" style="width: 30%; height: 16px; margin-bottom: 24px;"></div>
                    <div class="skeleton-line" style="width: 100%; height: 40px; margin-bottom: 16px;"></div>
                    <div class="skeleton-line" style="width: 100%; height: 40px;"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../shared/js/supabase-client.js"></script>
    <script src="../shared/app.js"></script>
    <script src="submissions.js"></script>
</body>
</html>
