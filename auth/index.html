<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account | TrevaForms</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><a href="../index.html" class="brand" aria-label="TrevaForms home"><div class="brand-mark">T</div><div><div class="brand-name">TrevaForms</div><div class="brand-sub">REGISTRAR'S OFFICE</div></div></a><h1 id="page-title">Welcome back</h1><p class="intro" id="page-intro">Sign in once and we will take you to the right workspace.</p><div id="notice" class="notice" role="alert" aria-live="polite"></div><div class="mode-switch"><button type="button" class="active" data-mode="login">Sign in</button><button type="button" data-mode="signup">Create account</button></div><form id="auth-form" novalidate><div class="field hidden" id="name-field"><label for="name">Full name</label><input id="name" autocomplete="name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="field hidden" id="confirm-field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password"></div><div class="hidden" id="role-field"><label>I am joining as</label><div class="role-picker"><label><input type="radio" name="role" value="student" checked>Student<span>Complete assigned forms</span></label><label><input type="radio" name="role" value="teacher">Teacher<span>Create and review forms</span></label></div></div><div class="form-row" id="login-options"><label class="remember"><input type="checkbox" checked>Remember me</label><button type="button" id="forgot-password" class="text-link">Forgot password?</button></div><button id="submit-button" class="primary" type="submit">Sign in</button></form><div class="separator">or</div><button id="google-button" type="button" class="oauth">Continue with Google</button><p class="footer">Your account type is stored securely in your TrevaForms profile.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../shared/js/supabase-client.js"></script><script src="auth.js"></script></body></html>
